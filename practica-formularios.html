<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Plano y Elegante</title>
    <!-- Vinculamos la hoja de estilos externa -->
    <link rel="stylesheet" href="/css/estilos-formularios.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Registro de Usuario</h2>
            <p>Presiona <b>Enter</b> en cualquier campo para activarlo e identificarlo.</p>
        </div>

        <form id="miFormulario" onsubmit="event.preventDefault();">
            
            <div class="form-group" id="group-nombre">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Alexis Felix">
            </div>

            <div class="form-group" id="group-email">
                <label for="email">Correo electrónico</label>
                <input type="text" id="email" class="form-control" placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group" id="group-pais">
                <label for="pais">País de residencia</label>
                <select id="pais" class="form-control">
                  <option value="" disabled selected>Selecciona tu país</option>
                    <option value="pe">Perú</option>
                    <option value="ve">Venezuela</option>
                    <option value="es">España</option>
                    <option value="mx">México</option>
                    <option value="ar">Argentina</option>
                    <option value="co">Colombia</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar datos</button>
            </div>

        </form>
    </div>

    <script>
        // Lógica para identificar el control activo al presionar Enter
        const inputsYSelects = document.querySelectorAll('.form-control');

        inputsYSelects.forEach(control => {
            control.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Evita el envío por defecto

                    // 1. Limpiar estado activo anterior
                    inputsYSelects.forEach(c => {
                        c.classList.remove('control-activo');
                        c.closest('.form-group').classList.remove('activo-por-enter');
                    });

                    // 2. Aplicar el estilo destacado al control actual
                    this.classList.add('control-activo');
                    this.closest('.form-group').classList.add('activo-por-enter');
                }
            });
        });
    </script>

</body>
</html>
